schemaVersion: 1
name: testing-strategies
description: Property-based coverage and flaky-test ownership practices with plausible testing distractors.
memories:
  - { id: testing-property-invariants, title: Use property tests for invariant-heavy code, content: "Parsers, serializers, and allocation algorithms use generated inputs to verify invariants across cases that examples are unlikely to cover.", tags: [testing, property, invariants], scope: global }
  - { id: testing-property-seeds, title: Record property test failure seeds, content: "CI output records the random seed and minimized counterexample so every generated failure can be reproduced locally.", tags: [testing, property, seeds], scope: global }
  - { id: testing-property-bounds, title: Bound generators to supported inputs, content: "Property generators cover the documented input domain and exclude invalid states already rejected by boundary validation.", tags: [testing, property, generators], scope: global }
  - { id: testing-property-examples, title: Keep examples for business landmarks, content: "Named example tests remain for regulatory thresholds and business landmarks even when property tests cover the surrounding input space.", tags: [testing, examples, business], scope: global }
  - { id: testing-flaky-quarantine, title: Quarantine flaky tests with an owner, content: "A confirmed flaky test moves to the quarantine job only with an owner and expiry issue; it may not silently retry in the required suite.", tags: [testing, flaky, quarantine], scope: global }
  - { id: testing-flaky-reproduce, title: Capture artifacts before quarantining tests, content: "Before quarantine, preserve the failing seed, logs, timing, and environment details and reproduce the instability across repeated isolated runs.", tags: [testing, flaky, diagnostics], scope: global }
  - { id: testing-flaky-retries, title: Retries do not make a test reliable, content: "Automatic retries can measure flake frequency in quarantine but cannot turn an intermittent assertion into a passing required check.", tags: [testing, flaky, retries], scope: global }
  - { id: testing-flaky-expiry, title: Quarantine expires after fourteen days, content: "The test-infrastructure team removes or disables quarantined tests whose repair issue has not closed within fourteen days.", tags: [testing, flaky, expiry], scope: global }
cases:
  - { id: testing-property-natural, need: property-based-tests, variant: natural-language, query: "When should tests generate many inputs instead of listing examples?", judgments: [{ memoryId: testing-property-invariants, relevance: 2 }, { memoryId: testing-property-examples, relevance: 1 }] }
  - { id: testing-property-keyword, need: property-based-tests, variant: keyword, query: "property tests parsers invariants generated inputs", judgments: [{ memoryId: testing-property-invariants, relevance: 2 }] }
  - { id: testing-property-paraphrase, need: property-based-tests, variant: paraphrase, query: "How can a random CI failure be reproduced on a laptop?", judgments: [{ memoryId: testing-property-seeds, relevance: 2 }, { memoryId: testing-property-bounds, relevance: 1 }] }
  - { id: testing-property-exact, need: property-based-tests, variant: identifier-exact, query: "random seed minimized counterexample", judgments: [{ memoryId: testing-property-seeds, relevance: 2 }] }
  - { id: testing-flaky-natural, need: flaky-test-policy, variant: natural-language, query: "What is required before removing an intermittent test from the main suite?", judgments: [{ memoryId: testing-flaky-reproduce, relevance: 2 }, { memoryId: testing-flaky-quarantine, relevance: 1 }] }
  - { id: testing-flaky-keyword, need: flaky-test-policy, variant: keyword, query: "flaky quarantine owner expiry issue", judgments: [{ memoryId: testing-flaky-quarantine, relevance: 2 }, { memoryId: testing-flaky-expiry, relevance: 1 }] }
  - { id: testing-flaky-paraphrase, need: flaky-test-policy, variant: paraphrase, query: "Can retrying an unstable assertion make the required check green?", judgments: [{ memoryId: testing-flaky-retries, relevance: 2 }, { memoryId: testing-flaky-quarantine, relevance: 1 }] }
  - { id: testing-flaky-exact, need: flaky-test-policy, variant: identifier-exact, query: "quarantine job", judgments: [{ memoryId: testing-flaky-quarantine, relevance: 2 }, { memoryId: testing-flaky-retries, relevance: 1 }] }
