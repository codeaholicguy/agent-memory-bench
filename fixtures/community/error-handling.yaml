schemaVersion: 1
name: error-handling-conventions
description: Exception translation and asynchronous failure-handling decisions with close vocabulary distractors.
memories:
  - { id: errors-boundary-translate, title: Translate infrastructure errors at service boundaries, content: "Application services translate database and vendor exceptions into typed domain errors; controllers map those stable errors to transport responses.", tags: [errors, boundaries, services], scope: global }
  - { id: errors-boundary-preserve-cause, title: Preserve causes when translating exceptions, content: "Every translated domain error retains the original exception as its cause for diagnostics without exposing infrastructure details to callers.", tags: [errors, diagnostics, cause], scope: global }
  - { id: errors-boundary-controller, title: Controllers do not catch database exceptions, content: "HTTP controllers handle typed application errors only and never branch directly on driver error codes or database exception classes.", tags: [errors, controllers, database], scope: global }
  - { id: errors-boundary-message, title: Public errors use stable codes not messages, content: "Clients branch on documented error codes; human-readable exception messages are diagnostic text and may change without notice.", tags: [errors, api, codes], scope: global }
  - { id: errors-async-supervisor, title: Supervise detached asynchronous work, content: "Detached tasks must run under a supervisor that records failure and retry state; do not launch an unobserved promise from a request handler.", tags: [errors, async, workers], scope: global }
  - { id: errors-async-awaited, title: Await work required by the response, content: "Any asynchronous operation required for a successful response is awaited before returning so its rejection follows the normal request error path.", tags: [errors, async, requests], scope: global }
  - { id: errors-async-events, title: Event consumers dead-letter poison messages, content: "After five failed deliveries an event consumer moves the poison message to the dead-letter queue and emits a failure metric.", tags: [errors, events, dlq], scope: global }
  - { id: errors-async-shutdown, title: Drain supervised tasks during shutdown, content: "Graceful shutdown stops accepting work and gives supervised background tasks thirty seconds to finish before cancellation.", tags: [async, shutdown, workers], scope: global }
cases:
  - { id: errors-boundary-natural, need: exception-translation, variant: natural-language, query: "Where should a SQL driver exception become an application error?", judgments: [{ memoryId: errors-boundary-translate, relevance: 2 }, { memoryId: errors-boundary-controller, relevance: 1 }, { memoryId: errors-boundary-message, relevance: 0 }] }
  - { id: errors-boundary-keyword, need: exception-translation, variant: keyword, query: "translate infrastructure exception typed domain error", judgments: [{ memoryId: errors-boundary-translate, relevance: 2 }, { memoryId: errors-boundary-preserve-cause, relevance: 1 }] }
  - { id: errors-boundary-paraphrase, need: exception-translation, variant: paraphrase, query: "How do we hide database failure details but keep diagnostics?", judgments: [{ memoryId: errors-boundary-preserve-cause, relevance: 2 }, { memoryId: errors-boundary-translate, relevance: 1 }] }
  - { id: errors-boundary-exact, need: exception-translation, variant: identifier-exact, query: "error.cause", judgments: [{ memoryId: errors-boundary-preserve-cause, relevance: 2 }, { memoryId: errors-boundary-message, relevance: 0 }] }
  - { id: errors-async-natural, need: asynchronous-failures, variant: natural-language, query: "Can a request handler start background work without waiting for it?", judgments: [{ memoryId: errors-async-supervisor, relevance: 2 }, { memoryId: errors-async-awaited, relevance: 1 }] }
  - { id: errors-async-keyword, need: asynchronous-failures, variant: keyword, query: "detached promise supervisor retry state", judgments: [{ memoryId: errors-async-supervisor, relevance: 2 }] }
  - { id: errors-async-paraphrase, need: asynchronous-failures, variant: paraphrase, query: "What happens to an event that keeps crashing its consumer?", judgments: [{ memoryId: errors-async-events, relevance: 2 }, { memoryId: errors-async-supervisor, relevance: 1 }] }
  - { id: errors-async-exact, need: asynchronous-failures, variant: identifier-exact, query: "dead-letter queue", judgments: [{ memoryId: errors-async-events, relevance: 2 }, { memoryId: errors-async-shutdown, relevance: 0 }] }
