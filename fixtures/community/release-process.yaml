schemaVersion: 1
name: release-process
description: Versioning and canary rollout decisions with realistic release vocabulary distractors.
memories:
  - { id: release-semver-breaking, title: Breaking public APIs require a major version, content: "Removing or changing a documented public API requires a major version unless the old contract remains available through a deprecation period.", tags: [release, semver, api], scope: global }
  - { id: release-semver-fix, title: Backward-compatible fixes increment patch, content: "A backward-compatible defect correction increments the patch version and documents any observable behavior change in the changelog.", tags: [release, semver, fixes], scope: global }
  - { id: release-changelog-user, title: Changelog entries describe user impact, content: "Release notes explain observable impact and migration action under Added, Changed, Fixed, and Removed headings rather than listing commit subjects.", tags: [release, changelog, users], scope: global }
  - { id: release-changelog-deprecation, title: Deprecations name the removal release, content: "A deprecation notice identifies the supported replacement and earliest major release in which the old interface may be removed.", tags: [release, changelog, deprecation], scope: global }
  - { id: release-canary-percent, title: Start production canaries at five percent, content: "A production rollout begins with five percent of instances for fifteen minutes before advancing when health gates remain within budget.", tags: [release, canary, rollout], scope: global }
  - { id: release-canary-gates, title: Canary gates compare errors and latency, content: "Promotion compares canary and stable error rate, latency, saturation, and business success metrics using the same traffic window.", tags: [release, canary, metrics], scope: global }
  - { id: release-canary-stop, title: Stop canaries automatically on regression, content: "The deployment controller halts and rolls back the canary when a required health gate breaches its configured threshold.", tags: [release, canary, rollback], scope: global }
  - { id: release-canary-schema, title: Canary releases require compatible schemas, content: "Database and event schema changes must remain compatible while stable and canary application versions run concurrently.", tags: [release, canary, schema], scope: global }
cases:
  - { id: release-semver-natural, need: versioning-release-notes, variant: natural-language, query: "Which version changes when a documented API is removed?", judgments: [{ memoryId: release-semver-breaking, relevance: 2 }, { memoryId: release-changelog-deprecation, relevance: 1 }] }
  - { id: release-semver-keyword, need: versioning-release-notes, variant: keyword, query: "semantic version breaking public API major", judgments: [{ memoryId: release-semver-breaking, relevance: 2 }] }
  - { id: release-semver-paraphrase, need: versioning-release-notes, variant: paraphrase, query: "How should release notes explain changes instead of dumping commits?", judgments: [{ memoryId: release-changelog-user, relevance: 2 }, { memoryId: release-semver-fix, relevance: 1 }] }
  - { id: release-semver-exact, need: versioning-release-notes, variant: identifier-exact, query: "Added Changed Fixed Removed", judgments: [{ memoryId: release-changelog-user, relevance: 2 }, { memoryId: release-changelog-deprecation, relevance: 1 }] }
  - { id: release-canary-natural, need: canary-rollout, variant: natural-language, query: "What is the first production rollout step before full deployment?", judgments: [{ memoryId: release-canary-percent, relevance: 2 }, { memoryId: release-canary-gates, relevance: 1 }] }
  - { id: release-canary-keyword, need: canary-rollout, variant: keyword, query: "five percent canary fifteen minutes", judgments: [{ memoryId: release-canary-percent, relevance: 2 }] }
  - { id: release-canary-paraphrase, need: canary-rollout, variant: paraphrase, query: "Which signals decide whether the trial deployment advances?", judgments: [{ memoryId: release-canary-gates, relevance: 2 }, { memoryId: release-canary-stop, relevance: 1 }] }
  - { id: release-canary-exact, need: canary-rollout, variant: identifier-exact, query: "canary health gate", judgments: [{ memoryId: release-canary-gates, relevance: 2 }, { memoryId: release-canary-stop, relevance: 1 }, { memoryId: release-canary-schema, relevance: 0 }] }
