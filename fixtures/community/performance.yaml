schemaVersion: 1
name: performance-tradeoffs
description: Cache invalidation and request batching decisions with shared performance vocabulary.
memories:
  - { id: perf-cache-read-through, title: Use read-through caching for product metadata, content: "Product metadata reads use a five-minute read-through cache; a miss loads from the database and populates the cache after a successful read.", tags: [performance, cache, products], scope: "project:catalog" }
  - { id: perf-cache-invalidate, title: Invalidate product cache after commit, content: "Product update transactions publish an invalidation event only after commit so readers never evict good data for a rolled-back write.", tags: [performance, cache, invalidation], scope: "project:catalog" }
  - { id: perf-cache-stampede, title: Coalesce concurrent cache misses, content: "Concurrent misses for the same product key share one in-flight load and use jittered expiry to prevent synchronized refresh spikes.", tags: [performance, cache, stampede], scope: "project:catalog" }
  - { id: perf-cache-negative, title: Briefly cache missing product records, content: "Confirmed missing product IDs are cached for fifteen seconds to limit repeated database work without hiding newly created records for long.", tags: [performance, cache, negative], scope: "project:catalog" }
  - { id: perf-batch-window, title: Batch analytics events for fifty milliseconds, content: "The analytics client buffers up to one hundred events or fifty milliseconds, whichever comes first, before sending a batch.", tags: [performance, batching, analytics], scope: global }
  - { id: perf-batch-interactive, title: Do not batch interactive commands, content: "User-facing commands that need an immediate result bypass the asynchronous analytics batcher and await their own response.", tags: [performance, batching, latency], scope: global }
  - { id: perf-batch-partial, title: Retry only failed batch items, content: "When the batch endpoint returns per-item outcomes, retry failed idempotent items only and record permanent rejections separately.", tags: [performance, batching, retries], scope: global }
  - { id: perf-batch-memory, title: Bound batch queues by count and bytes, content: "Batch buffers enforce both item-count and byte-size limits so a few oversized events cannot exhaust worker memory.", tags: [performance, batching, memory], scope: global }
cases:
  - { id: perf-cache-natural, need: cache-consistency, variant: natural-language, query: "When should product metadata be removed from cache after an update?", scope: "project:catalog", judgments: [{ memoryId: perf-cache-invalidate, relevance: 2 }, { memoryId: perf-cache-read-through, relevance: 1 }] }
  - { id: perf-cache-keyword, need: cache-consistency, variant: keyword, query: "cache invalidation after transaction commit", scope: "project:catalog", judgments: [{ memoryId: perf-cache-invalidate, relevance: 2 }] }
  - { id: perf-cache-paraphrase, need: cache-consistency, variant: paraphrase, query: "How do we stop many requests refreshing the same expired key?", scope: "project:catalog", judgments: [{ memoryId: perf-cache-stampede, relevance: 2 }, { memoryId: perf-cache-read-through, relevance: 1 }] }
  - { id: perf-cache-exact, need: cache-consistency, variant: identifier-exact, query: "read-through cache", scope: "project:catalog", judgments: [{ memoryId: perf-cache-read-through, relevance: 2 }, { memoryId: perf-cache-negative, relevance: 1 }] }
  - { id: perf-batch-natural, need: event-batching, variant: natural-language, query: "How long may analytics events wait before a batch is sent?", judgments: [{ memoryId: perf-batch-window, relevance: 2 }, { memoryId: perf-batch-interactive, relevance: 0 }] }
  - { id: perf-batch-keyword, need: event-batching, variant: keyword, query: "analytics batch 100 events 50 milliseconds", judgments: [{ memoryId: perf-batch-window, relevance: 2 }] }
  - { id: perf-batch-paraphrase, need: event-batching, variant: paraphrase, query: "What gets retried when some records in a bulk request fail?", judgments: [{ memoryId: perf-batch-partial, relevance: 2 }, { memoryId: perf-batch-window, relevance: 1 }] }
  - { id: perf-batch-exact, need: event-batching, variant: identifier-exact, query: "per-item outcomes", judgments: [{ memoryId: perf-batch-partial, relevance: 2 }, { memoryId: perf-batch-memory, relevance: 1 }] }
