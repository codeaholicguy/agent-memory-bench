schemaVersion: 1
name: dependency-management
description: Lockfile and dependency-upgrade policies with related package-management distractors.
memories:
  - { id: deps-lockfile-commit, title: Commit the package manager lockfile, content: "Applications commit the generated lockfile so local development, CI, and production resolve the same dependency graph.", tags: [dependencies, lockfile, reproducibility], scope: global }
  - { id: deps-lockfile-ci, title: CI uses frozen dependency installs, content: "Continuous integration uses npm ci and fails when package.json and package-lock.json disagree instead of rewriting dependency resolution.", tags: [dependencies, lockfile, ci], scope: global }
  - { id: deps-lockfile-library, title: Published libraries declare compatible ranges, content: "Library manifests declare supported dependency ranges while their repository lockfile still pins the graph used for development and tests.", tags: [dependencies, libraries, ranges], scope: global }
  - { id: deps-lockfile-regenerate, title: Regenerate lockfiles with one tool version, content: "Lockfile-only maintenance uses the repository-declared package manager version to avoid unrelated format and integrity churn.", tags: [dependencies, lockfile, tooling], scope: global }
  - { id: deps-upgrade-batches, title: Upgrade dependencies in small related batches, content: "Routine dependency updates group closely related packages and avoid mixing framework upgrades with unrelated libraries so regressions are attributable.", tags: [dependencies, upgrades, review], scope: global }
  - { id: deps-upgrade-security, title: Prioritize exploitable dependency advisories, content: "Security upgrades are prioritized by reachable vulnerable behavior and deployment exposure, not by severity labels without application context.", tags: [dependencies, security, advisories], scope: global }
  - { id: deps-upgrade-major, title: Major upgrades require migration notes, content: "A major dependency update documents removed APIs, configuration changes, rollback constraints, and the tests covering migrated behavior.", tags: [dependencies, upgrades, migration], scope: global }
  - { id: deps-upgrade-transitive, title: Explain direct pins for transitive packages, content: "A temporary override of a transitive dependency records the advisory or compatibility reason and an issue for removing the pin.", tags: [dependencies, overrides, transitive], scope: global }
cases:
  - { id: deps-lockfile-natural, need: dependency-reproducibility, variant: natural-language, query: "Why is the generated dependency lockfile checked into an application repository?", judgments: [{ memoryId: deps-lockfile-commit, relevance: 2 }, { memoryId: deps-lockfile-library, relevance: 1 }] }
  - { id: deps-lockfile-keyword, need: dependency-reproducibility, variant: keyword, query: "frozen install package lock CI reproducible", judgments: [{ memoryId: deps-lockfile-ci, relevance: 2 }, { memoryId: deps-lockfile-commit, relevance: 1 }] }
  - { id: deps-lockfile-paraphrase, need: dependency-reproducibility, variant: paraphrase, query: "What should automation do when the manifest and resolved graph differ?", judgments: [{ memoryId: deps-lockfile-ci, relevance: 2 }] }
  - { id: deps-lockfile-exact, need: dependency-reproducibility, variant: identifier-exact, query: "npm ci", judgments: [{ memoryId: deps-lockfile-ci, relevance: 2 }, { memoryId: deps-lockfile-regenerate, relevance: 0 }] }
  - { id: deps-upgrade-natural, need: dependency-upgrades, variant: natural-language, query: "How should routine library updates be grouped for easier regression diagnosis?", judgments: [{ memoryId: deps-upgrade-batches, relevance: 2 }, { memoryId: deps-upgrade-major, relevance: 1 }] }
  - { id: deps-upgrade-keyword, need: dependency-upgrades, variant: keyword, query: "small related dependency update batches", judgments: [{ memoryId: deps-upgrade-batches, relevance: 2 }] }
  - { id: deps-upgrade-paraphrase, need: dependency-upgrades, variant: paraphrase, query: "Does a critical advisory always require an emergency release?", judgments: [{ memoryId: deps-upgrade-security, relevance: 2 }, { memoryId: deps-upgrade-transitive, relevance: 1 }] }
  - { id: deps-upgrade-exact, need: dependency-upgrades, variant: identifier-exact, query: "transitive dependency override", judgments: [{ memoryId: deps-upgrade-transitive, relevance: 2 }, { memoryId: deps-upgrade-major, relevance: 0 }] }
