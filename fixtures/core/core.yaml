schemaVersion: 1
name: developer-memory-core
description: Realistic decisions, conventions, fixes, commands, identifiers, and distractors.
memories:
  - { id: api-response-dto, title: Return response DTOs from public endpoints, content: "Public REST handlers return response DTOs rather than domain entities so internal fields stay private and API versions remain stable.", tags: [api, dto], scope: global }
  - { id: api-request-validation, title: Validate request DTOs at controllers, content: "Inbound request DTOs are validated at controller boundaries before application services run.", tags: [api, validation], scope: global }
  - { id: api-url-versioning, title: Payments API uses URL versioning, content: "Payments public endpoints use /v1 and /v2 URL prefixes instead of Accept-header versioning.", tags: [api, versioning], scope: "project:payments" }
  - { id: api-pagination, title: Cursor pagination for event feeds, content: "Event feed endpoints use opaque cursor pagination and never expose database offsets.", tags: [api, pagination], scope: global }
  - { id: auth-cookie-session, title: Browser sessions use secure cookies, content: "Browser authentication uses HttpOnly Secure SameSite=Lax session cookies; tokens are not stored in localStorage.", tags: [auth, security], scope: global }
  - { id: auth-token-refresh, title: Refresh tokens rotate once, content: "OAuth refresh tokens rotate on successful use and reuse invalidates the token family.", tags: [auth, oauth], scope: global }
  - { id: auth-service-account, title: Workers use service accounts, content: "Background workers authenticate with short-lived service-account credentials from workload identity.", tags: [auth, workers], scope: global }
  - { id: auth-password-hash, title: Password hashing parameters, content: "Passwords use Argon2id with the shared security profile; never use reversible encryption.", tags: [auth, security], scope: global }
  - { id: db-expand-contract, title: Use expand and contract migrations, content: "Production schema changes add backward-compatible columns first, deploy readers and writers, backfill, then remove the old shape in a later release.", tags: [database, migrations], scope: global }
  - { id: db-transaction-boundary, title: Transactions live in application services, content: "Application services own transaction boundaries so repository calls participating in one use case commit atomically.", tags: [database, architecture], scope: global }
  - { id: db-index-review, title: Review query plans before indexes, content: "Capture EXPLAIN ANALYZE for the production-shaped query before adding a database index.", tags: [database, performance], scope: global }
  - { id: db-test-reset, title: Integration tests reset database state, content: "Database integration tests truncate owned tables between cases and never share mutable fixture rows.", tags: [database, testing], scope: global }
  - { id: web-1842-retry, title: WEB-1842 retry policy, content: "WEB-1842 introduced exponential backoff for idempotent GET requests. Retry at most three times and never retry validation failures.", tags: [frontend, retry, WEB-1842], scope: "repo:web" }
  - { id: web-timeout, title: Frontend request timeout, content: "Interactive frontend requests time out after ten seconds and display the recoverable network error state.", tags: [frontend, timeout], scope: "repo:web" }
  - { id: web-cache, title: Cache read-only profile requests, content: "The web client caches successful read-only profile requests for sixty seconds.", tags: [frontend, cache], scope: "repo:web" }
  - { id: web-validation-errors, title: Do not retry validation errors, content: "HTTP 400 and 422 validation responses are final and must be rendered next to the invalid fields.", tags: [frontend, validation], scope: "repo:web" }
  - { id: test-clock, title: Inject clocks into time-dependent code, content: "Services with expiry or scheduling behavior receive a Clock dependency; tests use a fixed clock rather than fake global timers.", tags: [testing, time], scope: global }
  - { id: test-network, title: Network boundaries use contract fakes, content: "Unit tests replace remote HTTP clients with typed contract fakes and integration tests exercise the real serializer.", tags: [testing, http], scope: global }
  - { id: test-naming, title: Test names describe observable behavior, content: "Name tests after observable outcomes and conditions instead of private method names.", tags: [testing, conventions], scope: global }
  - { id: test-snapshots, title: Avoid broad snapshots, content: "Prefer focused assertions; snapshots are reserved for stable serialized contracts reviewed as a whole.", tags: [testing, snapshots], scope: global }
  - { id: deploy-migrate, title: Run migrations before application rollout, content: "The release job applies backward-compatible database migrations before rolling application instances.", tags: [deployment, database], scope: global }
  - { id: deploy-rollback, title: Rollback keeps expanded schema, content: "Application rollback does not reverse expand-phase schema migrations; destructive contract migrations ship separately.", tags: [deployment, rollback], scope: global }
  - { id: deploy-health, title: Readiness checks dependencies, content: "Readiness verifies required database connectivity while liveness only checks process health.", tags: [deployment, health], scope: global }
  - { id: deploy-command, title: Preview deploy command, content: "Run npm run deploy -- --dry-run to inspect the release plan without changing infrastructure.", tags: [deployment, command], scope: global }
  - { id: log-request-id, title: Propagate request IDs in structured logs, content: "Every inbound request gets a requestId propagated through services and emitted as a structured JSON field.", tags: [logging, observability], scope: global }
  - { id: log-secrets, title: Redact credentials from logs, content: "Logging sanitizers remove authorization headers, cookies, tokens, passwords, and connection strings.", tags: [logging, security], scope: global }
  - { id: log-levels, title: Production logging levels, content: "Expected client failures log at info, recoverable dependency failures at warn, and unexpected failures at error.", tags: [logging, conventions], scope: global }
  - { id: log-metrics, title: Metrics use bounded labels, content: "Operational metrics never use user IDs or request IDs as labels because cardinality must remain bounded.", tags: [metrics, observability], scope: global }
  - { id: config-env, title: Environment variables override config files, content: "Deployment environment variables override repository config defaults; command-line flags override both.", tags: [config, conventions], scope: global }
  - { id: config-schema, title: Validate configuration at startup, content: "Parse the full configuration schema during startup and fail before opening network listeners when required values are invalid.", tags: [config, validation], scope: global }
  - { id: config-feature-flag, title: Feature flags require an owner, content: "Every temporary feature flag records an owner and removal issue before it is enabled.", tags: [config, flags], scope: global }
  - { id: config-local, title: Local config is not committed, content: "Developer-specific .env.local files remain ignored and example files contain placeholders only.", tags: [config, security], scope: global }
  - { id: err-payment-409, title: PAY-409 means duplicate idempotency key, content: "PAY-409 occurs when an idempotency key is reused with different payment parameters; return the original key conflict without retrying.", tags: [payments, error, PAY-409], scope: "project:payments" }
  - { id: err-payment-timeout, title: Payment provider timeouts are unknown outcomes, content: "After a provider timeout, reconcile by idempotency key before creating another payment attempt.", tags: [payments, timeout], scope: "project:payments" }
  - { id: err-web-500, title: WEB-500 client handling, content: "Unexpected server errors render the generic error boundary and attach the request ID to the support message.", tags: [frontend, error, WEB-500], scope: "repo:web" }
  - { id: err-validation, title: Validation errors preserve field paths, content: "Domain validation failures carry stable field paths so API and UI adapters can map them without parsing messages.", tags: [errors, validation], scope: global }
  - { id: git-rebase, title: Rebase feature branches before review, content: "Fetch origin and rebase a feature branch onto origin/main before opening its pull request.", tags: [git, workflow], scope: global }
  - { id: git-commit, title: Conventional commit subjects, content: "Use imperative conventional commit subjects such as fix(memory): relax natural language matching.", tags: [git, conventions], scope: global }
  - { id: git-generated, title: Do not commit generated coverage, content: "Coverage reports, local databases, caches, and generated debug logs stay out of commits.", tags: [git, cleanup], scope: global }
  - { id: git-force, title: Force push only with lease, content: "After rebasing an already published feature branch, use --force-with-lease rather than an unconditional force push.", tags: [git, safety], scope: global }
